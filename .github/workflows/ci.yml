name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Cerebro (yd-analytics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: JSON Schema al día
        working-directory: .
        run: |
          python scripts/gen_schema.py
          git diff --exit-code packages/contract/schema || \
            (echo "El JSON Schema no coincide con los modelos; corre 'npm run schema'." && exit 1)

  node:
    name: Contrato + Cara (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
