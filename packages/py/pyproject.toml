[project]
name = "yd-analytics"
version = "0.1.0"
description = "Yachay Deep — cerebro del sistema de representación gráfica (motor, resolver, grafos, profiler)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Vásconez-Paredes", email = "cvasconezp@yachaydeep.com" }]
dependencies = [
    "sqlalchemy>=2.0.36",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# El router HTTP es opcional: si solo usas el motor, no necesitas FastAPI.
api = ["fastapi>=0.111"]
# Ingesta de Excel/CSV (limpieza y normalización).
ingest = ["pandas>=2.0", "openpyxl>=3.1"]
# Estadística real (descriptiva + inferencial) e informes.
stats = ["numpy>=1.26", "scipy>=1.11"]
# Motor columnar para big data (o cambia el DSN a ClickHouse/BigQuery/Snowflake).
bigdata = ["duckdb>=1.0", "duckdb-engine>=0.13"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "fastapi>=0.111",
       "uvicorn[standard]>=0.30", "pandas>=2.0", "openpyxl>=3.1",
       "numpy>=1.26", "scipy>=1.11",
       "duckdb>=1.0", "duckdb-engine>=0.13", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=yd_analytics --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
